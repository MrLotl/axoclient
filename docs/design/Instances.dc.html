<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>AxoClient – Instanzen</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#4a4a4a;background-clip:padding-box;border:2px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
a{color:#9a9a9a}a:hover{color:#d9d9d9}
.head{image-rendering:pixelated}
.icon-btn{transition:background-color .12s ease}
.icon-btn:hover{background-color:#3a3a3a!important}
.win-btn:hover{background-color:#2c2c2c!important}
.win-close:hover{background-color:#c42b1c!important}
.nav-btn{transition:background-color .12s ease, color .12s ease}
.nav-btn:not([aria-current="page"]):hover{background-color:#2a2a2a!important;color:#d9d9d9!important}
.tool-btn{transition:background-color .12s ease}
.tool-btn:hover{background-color:#353535!important}
.new-btn{transition:filter .12s ease}
.new-btn:hover{filter:brightness(1.12)}
.tool-btn,.new-btn{white-space:nowrap;flex-shrink:0}
.seg-btn:not([aria-pressed="true"]):hover{color:#d9d9d9!important}
.start-btn{transition:background-color .12s ease}
.start-btn:hover{background-color:#2f4d37!important}
.inst-card{transition:background-color .12s ease}
.inst-card:hover{background-color:#2f2f2f!important}
/* Tastatur-Fokus */
button:focus{outline:none}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:2px!important;box-shadow:0 0 0 5px rgba(224,122,216,0.18)}
input[type="range"]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:4px!important}
.sr:focus-visible + span{outline:2px solid #e07ad8!important;outline-offset:2px!important}
label:has(> input[type="file"]:focus-visible){outline:2px solid #e07ad8!important;outline-offset:2px!important}
.field:focus-within,.search-box:focus-within{box-shadow:inset 0 0 0 1.5px rgba(224,122,216,0.75)!important}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #1f1f1f; font-family: 'Inter', system-ui, sans-serif; color: #e6e6e6">

<!-- Title bar -->
<div style="position: absolute; left: 19px; top: 10px; height: 32px; display: flex; align-items: center">
<div style="display: flex; align-items: baseline; gap: 5px">
<span style="font-size: 28px; line-height: 1; letter-spacing: -0.5px"><span style="font-weight: 600; color: #434343">Axo</span><span style="font-weight: 500; color: #3d3d3d">Client</span></span>
<span style="font-size: 12px; line-height: 1; font-weight: 500; color: #3d3d3d">v1.0</span>
</div>
</div>

<div style="position: absolute; top: 10px; right: 14px; display: flex; align-items: center; gap: 8px">

<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1H3z"></path><path d="M6.5 14c.3.6.9 1 1.5 1s1.2-.4 1.5-1"></path><path d="M8 1.5V3"></path></svg>
<span style="position: absolute; top: -3px; right: -3px; width: 14px; height: 14px; border-radius: 7px; background: #e83d3d; box-shadow: 0 0 0 2px #1f1f1f; color: #ffffff; font-size: 9px; font-weight: 700; line-height: 14px; text-align: center">1</span>
</button>

<button class="icon-btn" aria-label="Account-Menü öffnen" style="height: 32px; padding: 4px 6px 4px 4px; border: 0; border-radius: 8px; background: #242424; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: inherit">
<img class="head" src="/_blob/7d18b1aae1244f736c7ebddaa43d2158" alt="" style="width: 24px; height: 24px; border-radius: 5px; display: block">
<span style="font-size: 14px; font-weight: 500; color: #e6e6e6">Mr_L0tl</span>
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"></path></svg>
</button>

<div style="display: flex; gap: 4px; margin-left: 4px">
<button class="win-btn" aria-label="Minimieren" style="width: 26px; height: 26px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-linecap="round"><path d="M8 13h10"></path></svg>
</button>
<button class="win-btn" aria-label="Maximieren" style="width: 26px; height: 26px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-linejoin="round"><path d="M8.5 8.5h9v9h-9z"></path></svg>
</button>
<button class="win-btn win-close" aria-label="Schließen" style="width: 26px; height: 26px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-linecap="round"><path d="M8 8l10 10M18 8L8 18"></path></svg>
</button>
</div>
</div>

<!-- Sidebar -->
<nav aria-label="Hauptnavigation" style="position: absolute; left: 0; top: 52px; width: 66px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 4px">
<a class="nav-btn" href="Main.dc.html" aria-label="Home" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #8a8a8a; background: transparent; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L10 3.5l7 6V16a1 1 0 0 1-1 1h-3.5v-5h-5v5H4a1 1 0 0 1-1-1z"></path></svg>
</a>
<a class="nav-btn" href="Instances.dc.html" aria-label="Instanzen" aria-current="page" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #ecc6f2; background: linear-gradient(135deg, rgba(236, 72, 153, 0.16), rgba(139, 92, 246, 0.16)); box-shadow: inset 0 0 0 1px rgba(214, 140, 230, 0.14); text-decoration: none">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="3" height="12" rx="0.5"></rect><rect x="6.5" y="3" width="3" height="13.5" rx="0.5"></rect><rect x="10.5" y="5.5" width="3" height="11" rx="0.5"></rect><path d="M14.3 6.6l2.4-.6 2.6 10-2.4.6z"></path><path d="M1.5 17.5h17"></path></svg>
</a>
<a class="nav-btn" href="LocalServers.dc.html" aria-label="Lokale Server" title="Lokale Server" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #8a8a8a; background: transparent; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="6" rx="1.5"></rect><rect x="3" y="11" width="14" height="6" rx="1.5"></rect><path d="M6 6h.01M6 14h.01"></path><path d="M10 6h4M10 14h4"></path></svg>
</a>
<a class="nav-btn" href="Skins.dc.html" aria-label="Skins" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #8a8a8a; background: transparent; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3.2"></circle><path d="M4 17c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"></path></svg>
</a>
<a class="nav-btn" href="Console.dc.html" aria-label="Live-Konsole" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #8a8a8a; background: transparent; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="13" rx="2"></rect><path d="M6 8.5l2.5 2-2.5 2"></path><path d="M10.5 12.5H14"></path></svg>
</a>
<a class="nav-btn" href="Settings.dc.html" aria-label="Einstellungen" style="width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #8a8a8a; background: transparent; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</a>
</nav>

<!-- Content area -->
<main style="position: absolute; left: 66px; top: 52px; right: 0; bottom: 0; box-sizing: border-box; padding: 24px 28px; background: #222222; border-top-left-radius: 18px; display: flex; flex-direction: column; gap: 20px">

<!-- Toolbar -->
<div style="display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600; color: #e6e6e6">Instanzen</h1>
<span style="height: 22px; padding: 0 8px; border-radius: 11px; background: #2a2a2a; color: #a3a3a3; font-size: 12px; font-weight: 600; line-height: 22px">{{count}}</span>

<div role="group" aria-label="Ansicht" style="margin-left: 8px; padding: 3px; border-radius: 10px; background: #2a2a2a; display: flex; gap: 2px; flex-shrink: 0">
<button class="seg-btn" aria-label="Kartenansicht" aria-pressed="{{gridPressed}}" onClick="{{showGrid}}" style="{{gridStyle}}">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1"></rect><rect x="9" y="2" width="5" height="5" rx="1"></rect><rect x="2" y="9" width="5" height="5" rx="1"></rect><rect x="9" y="9" width="5" height="5" rx="1"></rect></svg>
</button>
<button class="seg-btn" aria-label="Listenansicht" aria-pressed="{{listPressed}}" onClick="{{showList}}" style="{{listStyle}}">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5.5 4h8.5M5.5 8h8.5M5.5 12h8.5"></path><path d="M2 4h.5M2 8h.5M2 12h.5"></path></svg>
</button>
</div>

<div style="flex-grow: 1"></div>

<a class="tool-btn" href="Modpacks.dc.html" style="height: 36px; padding: 0 14px; text-decoration: none; border-radius: 8px; background: #2a2a2a; color: #d9d9d9; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; box-sizing: border-box">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8"></path><path d="M4.5 6.5L8 10l3.5-3.5"></path><path d="M2.5 11v1.5a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V11"></path></svg>
Modpacks
</a>
<button class="tool-btn" style="height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #2a2a2a; color: #d9d9d9; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2.5h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-3"></path><path d="M2 8h8"></path><path d="M7 5l3 3-3 3"></path></svg>
Importieren
</button>
<a class="new-btn" href="InstanceCreate.dc.html" style="height: 36px; padding: 0 16px 0 14px; text-decoration: none; box-sizing: border-box; border-radius: 8px; background: linear-gradient(135deg, #db2777, #7c3aed); color: #ffffff; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 4px 14px rgba(167, 60, 200, 0.25)">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg>
Neue Instanz
</a>
</div>

<!-- Grid view -->
<sc-if value="{{isGrid}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-content: start; overflow-y: auto; min-height: 0">
<sc-for list="{{instances}}" as="i" hint-placeholder-count="6">
<article class="inst-card" style="padding: 10px; border-radius: 12px; background: #2a2a2a; display: flex; flex-direction: column; gap: 10px">
<a href="InstanceDetail.dc.html" aria-label="{{i.openLabel}}" style="position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #1a1a1a">
<img src="{{i.image}}" alt="" aria-hidden="true" style="position: absolute; inset: -30px; width: calc(100% + 60px); height: calc(100% + 60px); object-fit: cover; filter: blur(24px); opacity: 0.55">
<img src="{{i.image}}" alt="" style="position: absolute; top: 16px; bottom: 34px; left: 50%; transform: translateX(-50%); aspect-ratio: 1 / 1; height: calc(100% - 50px); border-radius: 16px; object-fit: cover; display: block; box-shadow: 0 6px 16px rgba(0,0,0,0.35)">
<span style="position: absolute; left: 8px; bottom: 8px; padding: 4px 8px; border-radius: 6px; background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(6px); color: #f2f2f2; font-size: 11px; font-weight: 600; letter-spacing: 0.2px">{{i.version}}</span>
</a>
<h2 style="margin: 0 2px; font-size: 15px; font-weight: 600; color: #e6e6e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.name}}</h2>
<button class="start-btn" aria-label="{{i.startLabel}}" style="height: 36px; border: 0; border-radius: 8px; background: #263b2c; color: #3fb950; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer">
<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 3.5v9l7-4.5z"></path></svg>
Starten
</button>
</article>
</sc-for>
</div>
</sc-if>

<!-- List view -->
<sc-if value="{{isList}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0">
<sc-for list="{{instances}}" as="i" hint-placeholder-count="6">
<article class="inst-card" style="padding: 8px 10px 8px 8px; border-radius: 10px; background: #2a2a2a; display: flex; align-items: center; gap: 14px">
<a href="InstanceDetail.dc.html" aria-label="{{i.openLabel}}" style="display: block; flex-shrink: 0"><img src="{{i.image}}" alt="" style="width: 54px; height: 54px; border-radius: 8px; object-fit: cover; display: block"></a>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 15px; font-weight: 600; color: #e6e6e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{i.name}}</h2>
<span style="font-size: 12px; color: #a3a3a3">{{i.version}}</span>
</div>
<button class="start-btn" aria-label="{{i.startLabel}}" style="width: 120px; height: 36px; border: 0; border-radius: 8px; background: #263b2c; color: #3fb950; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; flex-shrink: 0">
<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 3.5v9l7-4.5z"></path></svg>
Starten
</button>
</article>
</sc-for>
</div>
</sc-if>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var view = this.state.view || 'grid';
var segBase = 'width: 34px; height: 30px; padding: 0; border: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; ';
var segOn = segBase + 'color: #ecc6f2; background: linear-gradient(135deg, rgba(236, 72, 153, 0.16), rgba(139, 92, 246, 0.16)); box-shadow: inset 0 0 0 1px rgba(214, 140, 230, 0.14)';
var segOff = segBase + 'color: #8a8a8a; background: transparent';
var instances = [
{ name: 'Survival mit Freunden', version: '1.21.4 · Fabric', image: '/_blob/532ac75fc0a1ca9b21fc14f3b3a23fc6' },
{ name: 'PvP', version: '1.8.9 · Forge', image: '/_blob/c478ff1d64e58c156d1356caea212505' },
{ name: 'Create Modpack', version: '1.20.1 · Forge', image: '/_blob/36f362f60f246657a0ee8a5d3be8d7e6' },
{ name: 'Vanilla', version: '1.21.4 · Vanilla', image: '/_blob/1f48d344637828b690ffda3ef27db648' },
{ name: 'Skyblock', version: '1.21.1 · Fabric', image: '/_blob/a10c2683c7db0da47b127e94efd0445a' },
{ name: 'Hardcore', version: '1.21.4 · Vanilla', image: '/_blob/417ed9b44cf2aebf90dab262c6f59701' }
].map(function (i) { return Object.assign({}, i, { startLabel: i.name + ' starten', openLabel: i.name + ' öffnen' }); });
return {
instances: instances,
count: instances.length,
isGrid: view === 'grid',
isList: view === 'list',
gridPressed: view === 'grid' ? 'true' : 'false',
listPressed: view === 'list' ? 'true' : 'false',
gridStyle: view === 'grid' ? segOn : segOff,
listStyle: view === 'list' ? segOn : segOff,
showGrid: function () { self.setState({ view: 'grid' }); },
showList: function () { self.setState({ view: 'list' }); }
};
}
}
</script>
</body>
</html>
