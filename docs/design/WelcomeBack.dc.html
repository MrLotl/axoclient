<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>AxoClient – Anmelden</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.head{image-rendering:pixelated}
.win-btn{transition:background-color .12s ease}
.win-btn:hover{background-color:#2c2c2c!important}
.win-close:hover{background-color:#c42b1c!important}
.ms-btn{transition:filter .12s ease, transform .12s ease}
.ms-btn:hover{filter:brightness(1.1)}
.ms-btn:active{transform:scale(0.98)}
.link-btn{transition:color .12s ease}
.link-btn:hover{color:#f5d0fb!important}
.acc-row{transition:background-color .12s ease, box-shadow .12s ease}
.acc-row:hover{background-color:#323232!important}
.copy-btn{transition:background-color .12s ease}
.copy-btn:hover{background-color:#3a3a3a!important}
.ghost-btn{transition:background-color .12s ease}
.ghost-btn:hover{background-color:#3a3a3a!important}
.second-btn{transition:background-color .12s ease}
.second-btn:not(:disabled):hover{background-color:#444444!important}
.second-btn:disabled{opacity:.45;cursor:default!important}
.grad-btn{transition:filter .12s ease, opacity .12s ease}
.grad-btn:not(:disabled):hover{filter:brightness(1.12)}
.grad-btn:disabled{opacity:.45;cursor:default!important;box-shadow:none!important}
.field{transition:box-shadow .12s ease}
.field:focus-within{box-shadow:inset 0 0 0 1px rgba(214,140,230,0.6)!important}
.field input::placeholder{color:#6b6b6b}
.sr{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.pick-row{position:relative;transition:background-color .12s ease}
.pick-row:hover{background-color:#323232!important}
.pick-row .sr:focus-visible + span{outline:2px solid rgba(214,140,230,0.7);outline-offset:2px}
.cat-chip{transition:background-color .12s ease, color .12s ease}
.cat-chip:not([aria-pressed="true"]):hover{background-color:#353535!important;color:#e6e6e6!important}
.inst-btn{transition:filter .12s ease, background-color .12s ease}
.inst-btn:not(:disabled):hover{filter:brightness(1.15)}
.mini-x{transition:background-color .12s ease, color .12s ease}
.mini-x:hover{background-color:#4a2a2a!important;color:#ff8a80!important}
.cat-row{transition:background-color .12s ease}
.cat-row:hover{background-color:#2f2f2f!important}
@keyframes axo-spin{to{transform:rotate(360deg)}}
@keyframes axo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes axo-fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ram-range{-webkit-appearance:none;appearance:none;width:100%;height:6px;margin:8px 0;border-radius:3px;background-color:#3a3a3a;background-image:linear-gradient(90deg,#db2777,#7c3aed);background-repeat:no-repeat;outline:none;cursor:pointer}
.ram-range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#ffffff;border:0;box-shadow:0 0 0 4px rgba(214,140,230,0.25),0 2px 6px rgba(0,0,0,0.4)}
.ram-range::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#ffffff;border:0;box-shadow:0 0 0 4px rgba(214,140,230,0.25),0 2px 6px rgba(0,0,0,0.4)}
/* Tastatur-Fokus */
button:focus{outline:none}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:2px!important;box-shadow:0 0 0 5px rgba(224,122,216,0.18)}
input[type="range"]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:4px!important}
.sr:focus-visible + span{outline:2px solid #e07ad8!important;outline-offset:2px!important}
label:has(> input[type="file"]:focus-visible){outline:2px solid #e07ad8!important;outline-offset:2px!important}
.field:focus-within,.search-box:focus-within{box-shadow:inset 0 0 0 1.5px rgba(224,122,216,0.75)!important}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #1f1f1f; font-family: 'Inter', system-ui, sans-serif; color: #e6e6e6">
<div aria-hidden="true" style="position: absolute; left: -160px; top: -200px; width: 760px; height: 600px; border-radius: 50%; background: radial-gradient(closest-side, rgba(236, 72, 153, 0.16), rgba(139, 92, 246, 0.07) 60%, rgba(31, 31, 31, 0))"></div>
<div aria-hidden="true" style="position: absolute; right: -200px; bottom: -260px; width: 820px; height: 640px; border-radius: 50%; background: radial-gradient(closest-side, rgba(139, 92, 246, 0.14), rgba(31, 31, 31, 0))"></div>
<!-- Title bar -->
<div style="position: absolute; left: 19px; top: 10px; height: 32px; display: flex; align-items: center; z-index: 2">
<div style="display: flex; align-items: baseline; gap: 5px">
<span style="font-size: 28px; line-height: 1; letter-spacing: -0.5px"><span style="font-weight: 600; color: #434343">Axo</span><span style="font-weight: 500; color: #3d3d3d">Client</span></span>
<span style="font-size: 12px; line-height: 1; font-weight: 500; color: #3d3d3d">v1.0</span>
</div>
</div>
<div style="position: absolute; top: 13px; right: 14px; display: flex; gap: 4px; z-index: 2">
<button class="win-btn" aria-label="Minimieren" style="width: 26px; height: 26px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-linecap="round"><path d="M8 13h10"></path></svg></button>
<button class="win-btn" aria-label="Maximieren" style="width: 26px; height: 26px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-linejoin="round"><path d="M8.5 8.5h9v9h-9z"></path></svg></button>
<button class="win-btn win-close" aria-label="Schließen" style="width: 26px; height: 26px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-linecap="round"><path d="M8 8l10 10M18 8L8 18"></path></svg></button>
</div>


<div style="position: absolute; inset: 52px 0 0 0; display: flex; align-items: center; justify-content: center">
<div style="width: 460px; box-sizing: border-box; padding: 30px; border-radius: 20px; background: rgba(38, 38, 38, 0.92); backdrop-filter: blur(10px); box-shadow: 0 30px 70px rgba(0,0,0,0.5), inset 0 0 0 1px #343434; display: flex; flex-direction: column; gap: 22px; animation: axo-fade .3s ease-out">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<img src="/_blob/f799e57da31063260c630de0899f9def" alt="AxoClient" style="width: 56px; height: 56px; border-radius: 14px">
<h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.4px; color: #f5f5f5">Willkommen zurück</h1>
<span style="font-size: 13.5px; color: #a3a3a3; line-height: 1.5">Deine Instanzen und Einstellungen sind noch da.<br>Melde dich an, um weiterzuspielen.</span>
</div>
<div style="display: flex; align-items: center; justify-content: center; gap: 8px">
<div style="display: flex"><img class="head" src="/_blob/532ac75fc0a1ca9b21fc14f3b3a23fc6" alt="" style="width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #262626; border-radius: 7px; object-fit: cover; margin-left: 0px"><img class="head" src="/_blob/c478ff1d64e58c156d1356caea212505" alt="" style="width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #262626; border-radius: 7px; object-fit: cover; margin-left: -10px"><img class="head" src="/_blob/36f362f60f246657a0ee8a5d3be8d7e6" alt="" style="width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #262626; border-radius: 7px; object-fit: cover; margin-left: -10px"><img class="head" src="/_blob/1f48d344637828b690ffda3ef27db648" alt="" style="width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #262626; border-radius: 7px; object-fit: cover; margin-left: -10px"><img class="head" src="/_blob/a10c2683c7db0da47b127e94efd0445a" alt="" style="width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #262626; border-radius: 7px; object-fit: cover; margin-left: -10px"><img class="head" src="/_blob/417ed9b44cf2aebf90dab262c6f59701" alt="" style="width: 32px; height: 32px; box-sizing: border-box; border: 2px solid #262626; border-radius: 7px; object-fit: cover; margin-left: -10px"></div>
<span style="font-size: 12.5px; color: #8a8a8a">6 Instanzen gefunden</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 11px; font-weight: 600; color: #7a7a7a; text-transform: uppercase; letter-spacing: 0.7px">Deine Konten</span>
<sc-for list="{{accounts}}" as="a" hint-placeholder-count="2">
<button class="acc-row" onClick="{{a.login}}" disabled="{{a.disabled}}" aria-label="{{a.label}}" style="{{a.style}}">
<img class="head" src="{{a.head}}" alt="" style="width: 40px; height: 40px; border-radius: 8px; flex-shrink: 0">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left">
<span style="font-size: 14px; font-weight: 600; color: #f2f2f2">{{a.name}}</span>
<span style="font-size: 12px; color: {{a.subColor}}">{{a.sub}}</span>
</span>
<sc-if value="{{a.busy}}" hint-placeholder-val="{{false}}"><span style="width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 2.5px solid #3a3a3a; border-top-color: #d36ad8; animation: axo-spin .8s linear infinite; flex-shrink: 0"></span></sc-if>
<sc-if value="{{a.ok}}" hint-placeholder-val="{{false}}"><span style="width: 22px; height: 22px; border-radius: 11px; background: #3fb950; color: #ffffff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"></path></svg></span></sc-if>
<sc-if value="{{a.idle}}" hint-placeholder-val="{{true}}"><span style="height: 30px; padding: 0 12px; border-radius: 8px; background: linear-gradient(135deg, #db2777, #7c3aed); color: #ffffff; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-shrink: 0">Anmelden</span></sc-if>
</button>
</sc-for>
<button class="acc-row" onClick="{{other}}" style="height: 56px; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; box-shadow: inset 0 0 0 1.5px #3a3a3a; display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: inherit; color: #d9d9d9; font-size: 13.5px; font-weight: 600">
<span style="width: 40px; height: 40px; border-radius: 8px; background: #303030; color: #ecc6f2; display: flex; align-items: center; justify-content: center"><svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6.5" height="6.5"></rect><rect x="8.5" y="1" width="6.5" height="6.5"></rect><rect x="1" y="8.5" width="6.5" height="6.5"></rect><rect x="8.5" y="8.5" width="6.5" height="6.5"></rect></svg></span>
Mit anderem Microsoft-Konto anmelden
</button>
</div>
<sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
<a class="ms-btn" href="Main.dc.html" style="height: 50px; padding: 0 22px; border-radius: 12px; background: linear-gradient(135deg, #db2777, #7c3aed); color: #ffffff; font-family: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; box-shadow: 0 10px 28px rgba(167, 60, 200, 0.35); text-decoration: none">Weiter zum Launcher<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"></path></svg></a>
</sc-if>
<div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><span style="font-size: 12px; color: #6b6b6b; text-align: center">Die Anmeldung öffnet sich in einem eigenen Fenster.</span><a class="link-btn" href="Main.dc.html" style="font-size: 12.5px; font-weight: 500; color: #8a8a8a; text-decoration: none">Ohne Anmeldung fortfahren</a></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { busy: null, ok: null }; }
componentWillUnmount() { clearTimeout(this.t); }
renderVals() {
var self = this;
var s = this.state;
var ACC = [
{ id: 'main', name: 'Mr_L0tl', head: '/_blob/7d18b1aae1244f736c7ebddaa43d2158', sub: 'Abgemeldet · zuletzt gestern' },
{ id: 'alt', name: 'L0tl_Builder', head: '/_blob/d9ad306d19e19888bd99dfc8236cccb1', sub: 'Abgemeldet · zuletzt vor 12 Tagen' }
];
function start(id) {
self.setState({ busy: id, ok: null });
clearTimeout(self.t);
self.t = setTimeout(function () { self.setState({ busy: null, ok: id }); }, 1800);
}
return {
accounts: ACC.map(function (a) {
var busy = s.busy === a.id, ok = s.ok === a.id;
return {
name: a.name, head: a.head,
sub: busy ? 'Warte auf Anmeldung …' : ok ? 'Angemeldet' : a.sub,
subColor: ok ? '#3fb950' : busy ? '#ecc6f2' : '#8a8a8a',
busy: busy, ok: ok, idle: !busy && !ok, disabled: !!s.busy,
label: a.name + ' anmelden',
style: 'height: 64px; padding: 0 12px; border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; font-family: inherit; ' + (ok ? 'background: rgba(63, 185, 80, 0.08); box-shadow: inset 0 0 0 1px rgba(63, 185, 80, 0.3)' : busy ? 'background: linear-gradient(135deg, rgba(236, 72, 153, 0.10), rgba(139, 92, 246, 0.10)), #2c2c2c; box-shadow: inset 0 0 0 1px rgba(214, 140, 230, 0.3)' : 'background: #2c2c2c'),
login: function () { start(a.id); }
};
}),
other: function () {},
ready: !!s.ok
};
}
}
</script>
</body>
</html>
