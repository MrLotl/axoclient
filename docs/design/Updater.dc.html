<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>AxoClient – Update</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.head{image-rendering:pixelated}
.win-btn{transition:background-color .12s ease}
.win-btn:hover{background-color:#2c2c2c!important}
.win-close:hover{background-color:#c42b1c!important}
.ghost-btn{transition:background-color .12s ease, color .12s ease}
.ghost-btn:hover{background-color:#333333!important;color:#e6e6e6!important}
.grad-btn{transition:filter .12s ease}
.grad-btn:hover{filter:brightness(1.12)}
@keyframes axo-shine{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
@keyframes axo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes axo-pulse{0%,100%{opacity:.55}50%{opacity:1}}
/* Tastatur-Fokus */
button:focus{outline:none}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:2px!important;box-shadow:0 0 0 5px rgba(224,122,216,0.18)}
input[type="range"]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:4px!important}
.sr:focus-visible + span{outline:2px solid #e07ad8!important;outline-offset:2px!important}
label:has(> input[type="file"]:focus-visible){outline:2px solid #e07ad8!important;outline-offset:2px!important}
.field:focus-within,.search-box:focus-within{box-shadow:inset 0 0 0 1.5px rgba(224,122,216,0.75)!important}
</style>
</helmet>
<div style="position: relative; width: 520px; height: 320px; overflow: hidden; box-sizing: border-box; border-radius: 14px; background: #1f1f1f; box-shadow: inset 0 0 0 1px #2e2e2e; font-family: 'Inter', system-ui, sans-serif; color: #e6e6e6">

<div aria-hidden="true" style="position: absolute; left: -80px; top: -140px; width: 420px; height: 320px; border-radius: 50%; background: radial-gradient(closest-side, rgba(236, 72, 153, 0.22), rgba(139, 92, 246, 0.10) 60%, rgba(31, 31, 31, 0))"></div>
<div aria-hidden="true" style="position: absolute; right: -120px; bottom: -160px; width: 380px; height: 300px; border-radius: 50%; background: radial-gradient(closest-side, rgba(139, 92, 246, 0.16), rgba(31, 31, 31, 0))"></div>

<!-- Title bar -->
<div style="position: absolute; left: 16px; right: 10px; top: 10px; height: 26px; display: flex; align-items: center; gap: 6px">
<span style="font-size: 15px; line-height: 1; letter-spacing: -0.3px"><span style="font-weight: 600; color: #4a4a4a">Axo</span><span style="font-weight: 500; color: #444444">Client</span></span>
<span style="font-size: 11px; font-weight: 500; color: #444444">Updater</span>
<div style="flex-grow: 1"></div>
<button class="win-btn" aria-label="Minimieren" style="width: 26px; height: 26px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#bdbdbd" stroke-width="1.5" stroke-linecap="round"><path d="M8 13h10"></path></svg>
</button>
<button class="win-btn win-close" aria-label="Schließen" style="width: 26px; height: 26px; padding: 0; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#bdbdbd" stroke-width="1.5" stroke-linecap="round"><path d="M8 8l10 10M18 8L8 18"></path></svg>
</button>
</div>

<!-- Body -->
<div style="position: absolute; left: 32px; right: 32px; top: 58px; bottom: 26px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; gap: 16px">
<div style="position: relative; width: 64px; height: 64px; flex-shrink: 0; animation: axo-float 3s ease-in-out infinite">
<img src="/_blob/f799e57da31063260c630de0899f9def" alt="AxoClient" style="position: relative; width: 64px; height: 64px; display: block">
</div>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.2px; color: #f5f5f5">{{title}}</h1>
<div style="display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 600">
<span style="height: 20px; padding: 0 7px; border-radius: 6px; background: #2c2c2c; color: #9a9a9a; line-height: 20px">v1.0</span>
<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#7a7a7a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9.5 4.5L13 8l-3.5 3.5"></path></svg>
<span style="height: 20px; padding: 0 7px; border-radius: 6px; background: linear-gradient(135deg, #db2777, #7c3aed); color: #ffffff; line-height: 20px">v1.0.2</span>
</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 9px">
<div role="progressbar" aria-label="Update-Fortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" style="position: relative; height: 8px; border-radius: 4px; overflow: hidden; background: #2c2c2c">
<span style="{{fillStyle}}"></span>
<span aria-hidden="true" style="{{shineStyle}}"></span>
</div>
<div style="display: flex; align-items: baseline; gap: 10px; font-size: 12.5px">
<span style="flex-grow: 1; color: #d9d9d9; font-weight: 500">{{status}}</span>
<span style="color: #8a8a8a; font-variant-numeric: tabular-nums">{{detail}}</span>
</div>
</div>

<div style="flex-grow: 1"></div>

<div style="display: flex; align-items: center; gap: 10px">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; {{st.color}}">
<span style="{{st.dot}}">
<sc-if value="{{st.done}}" hint-placeholder-val="{{false}}"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"></path></svg></sc-if>
</span>
{{st.label}}
</span>
</sc-for>
<div style="flex-grow: 1"></div>
<sc-if value="{{running}}" hint-placeholder-val="{{true}}">
<button class="ghost-btn" onClick="{{cancel}}" style="height: 32px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: #8a8a8a; font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer">Abbrechen</button>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a class="grad-btn" href="Main.dc.html" style="height: 34px; padding: 0 16px; border-radius: 9px; background: linear-gradient(135deg, #db2777, #7c3aed); color: #ffffff; font-size: 13px; font-weight: 600; text-decoration: none; display: flex; align-items: center; white-space: nowrap; flex-shrink: 0; box-shadow: 0 4px 14px rgba(167, 60, 200, 0.3)">AxoClient starten</a>
</sc-if>
<sc-if value="{{cancelled}}" hint-placeholder-val="{{false}}">
<button class="grad-btn" onClick="{{restart}}" style="height: 34px; padding: 0 16px; border: 0; border-radius: 9px; background: linear-gradient(135deg, #db2777, #7c3aed); color: #ffffff; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0">Erneut versuchen</button>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":320}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { p: 0, cancelled: false };
}
componentDidMount() { this.start(); }
componentWillUnmount() { clearInterval(this.timer); }
start() {
var self = this;
clearInterval(this.timer);
this.setState({ p: 0, cancelled: false });
this.timer = setInterval(function () {
var p = Math.min(100, self.state.p + 0.6 + Math.random() * 1.4);
self.setState({ p: p });
if (p >= 100) clearInterval(self.timer);
}, 80);
}
renderVals() {
var self = this;
var p = this.state.p;
var cancelled = this.state.cancelled;
var phase = p < 70 ? 0 : p < 94 ? 1 : p < 100 ? 2 : 3;
var mb = Math.min(58.1, p / 70 * 58.1);
var fmt = function (v) { return v.toFixed(1).replace('.', ','); };
var status = cancelled ? 'Update abgebrochen' : ['Lade Update herunter …', 'Installiere Dateien …', 'Räume auf …', 'Fertig! Viel Spaß mit v1.0.2'][phase];
var detail = cancelled ? 'Es wurde nichts geändert' : phase === 0 ? fmt(mb) + ' von 58,1 MB · 4,2 MB/s' : phase === 3 ? '' : Math.round(p) + ' %';
var labels = ['Herunterladen', 'Installieren', 'Neustarten'];
var steps = labels.map(function (l, i) {
var stepDone = phase > i || phase === 3;
var current = !stepDone && (phase === i || (i === 2 && phase === 2));
return {
label: l, done: stepDone,
color: 'color: ' + (stepDone ? '#d9d9d9' : current && !cancelled ? '#ecc6f2' : '#5f5f5f'),
dot: 'width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; ' + (stepDone ? 'background: linear-gradient(135deg, #db2777, #7c3aed)' : current && !cancelled ? 'box-shadow: inset 0 0 0 2px #d36ad8' : 'box-shadow: inset 0 0 0 2px #3a3a3a')
};
});
return {
title: cancelled ? 'Update angehalten' : phase === 3 ? 'Update installiert' : 'AxoClient wird aktualisiert',
pct: Math.round(p), status: status, detail: detail, steps: steps,
running: !cancelled && phase < 3, done: !cancelled && phase === 3, cancelled: cancelled,
fillStyle: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + p + '%; border-radius: 4px; background: ' + (cancelled ? '#4a4a4a' : 'linear-gradient(90deg, #db2777, #7c3aed)') + '; box-shadow: 0 0 12px rgba(217, 70, 239, ' + (cancelled ? '0' : '0.45') + ')',
shineStyle: !cancelled && phase < 3 ? 'position: absolute; top: 0; bottom: 0; left: 0; width: 25%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); animation: axo-shine 1.4s ease-in-out infinite' : 'display: none',
cancel: function () { clearInterval(self.timer); self.setState({ cancelled: true }); },
restart: function () { self.start(); }
};
}
}
</script>
</body>
</html>
