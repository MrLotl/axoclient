<style>
body{margin:0}
*{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#4a4a4a;background-clip:padding-box;border:2px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
a{color:#9a9a9a}a:hover{color:#d9d9d9}
.head{image-rendering:pixelated}
.icon-btn{transition:background-color .12s ease}
.icon-btn:hover{background-color:#3a3a3a!important}
.win-btn:hover{background-color:#2c2c2c!important}
.win-close:hover{background-color:#c42b1c!important}
.nav-btn{transition:background-color .12s ease, color .12s ease}
.nav-btn:not([aria-current="page"]):hover{background-color:#2a2a2a!important;color:#d9d9d9!important}
.tool-btn{transition:background-color .12s ease}
.tool-btn:hover{background-color:#353535!important}
.new-btn{transition:filter .12s ease}
.new-btn:hover{filter:brightness(1.12)}
.tool-btn,.new-btn{white-space:nowrap;flex-shrink:0}
.seg-btn:not([aria-pressed="true"]):hover{color:#d9d9d9!important}
.search-box:focus-within{box-shadow:inset 0 0 0 1px rgba(214,140,230,0.45)!important}
.search-box input::placeholder{color:#6b6b6b}
.search-box input::-webkit-search-cancel-button{display:none}
.log-row:hover{background-color:rgba(255,255,255,0.03)}
.log-scroll::-webkit-scrollbar{width:10px}
.log-scroll::-webkit-scrollbar-thumb{background:#333;border-radius:5px;border:2px solid #191919}
.log-scroll::-webkit-scrollbar-track{background:transparent}
.menu-item{transition:background-color .12s ease}
.menu-item:hover{background-color:#383838!important}
.src-btn{transition:background-color .12s ease}
.src-btn:hover{background-color:#323232!important}
/* Tastatur-Fokus */
button:focus{outline:none}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:2px!important;box-shadow:0 0 0 5px rgba(224,122,216,0.18)}
input[type="range"]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:4px!important}
.sr:focus-visible + span{outline:2px solid #e07ad8!important;outline-offset:2px!important}
label:has(> input[type="file"]:focus-visible){outline:2px solid #e07ad8!important;outline-offset:2px!important}
.field:focus-within,.search-box:focus-within{box-shadow:inset 0 0 0 1.5px rgba(224,122,216,0.75)!important}
</style>

<!-- Content area -->
<main style="position: absolute; left: 66px; top: 52px; right: 0; bottom: 0; box-sizing: border-box; padding: 24px 28px; background: #222222; border-top-left-radius: 18px; display: flex; flex-direction: column; gap: 16px">

<!-- Header row -->
<div style="display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-size: 20px; font-weight: 600; color: #e6e6e6">Live-Konsole</h1>
<div style="position: relative">
<button class="src-btn" aria-haspopup="listbox" aria-expanded="{{srcOpen}}" aria-label="Log-Quelle wählen" onClick="{{toggleSrc}}" style="height: 30px; padding: 0 8px 0 10px; border: 0; border-radius: 15px; background: #2a2a2a; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 12px; color: #a3a3a3; cursor: pointer">
<span style="{{src.dotStyle}}"></span>
<span style="color: #d9d9d9; font-weight: 500">{{src.statusLabel}}</span>
<span>{{src.kindLabel}} · <span style="color: #e6e6e6; font-weight: 500">{{src.name}}</span> · {{src.type}}</span>
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#a3a3a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="{{srcChevron}}"><path d="M4 6l4 4 4-4"></path></svg>
</button>
<sc-if value="{{srcOpen}}" hint-placeholder-val="{{false}}">
<div role="listbox" aria-label="Log-Quelle" style="position: absolute; top: 38px; left: 0; z-index: 20; width: 340px; box-sizing: border-box; padding: 6px; border-radius: 12px; background: #2c2c2c; box-shadow: 0 16px 40px rgba(0,0,0,0.5), inset 0 0 0 1px #363636; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{srcGroups}}" as="g" hint-placeholder-count="2">
<span style="padding: 8px 10px 4px; font-size: 11px; font-weight: 600; color: #7a7a7a; text-transform: uppercase; letter-spacing: 0.7px">{{g.title}}</span>
<sc-for list="{{g.items}}" as="o" hint-placeholder-count="2">
<button class="menu-item" role="option" aria-selected="{{o.selected}}" onClick="{{o.pick}}" style="{{o.style}}">
<img class="head" src="{{o.icon}}" alt="" style="width: 28px; height: 28px; border-radius: 6px; object-fit: cover; flex-shrink: 0">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; text-align: left">
<span style="font-size: 13px; font-weight: 600; color: #f2f2f2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{o.name}}</span>
<span style="font-size: 11.5px; color: #8a8a8a">{{o.type}}</span>
</span>
<span style="{{o.statusStyle}}"><span style="{{o.dotStyle}}"></span>{{o.statusLabel}}</span>
</button>
</sc-for>
</sc-for>
</div>
</sc-if>
</div>
<div style="flex-grow: 1"></div>
<button class="tool-btn" onClick="{{copy}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #2a2a2a; color: #d9d9d9; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">

{{copyLabel}}
</button>
<button class="tool-btn" onClick="{{clear}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #2a2a2a; color: #d9d9d9; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11"></path><path d="M6 4.5V3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5"></path><path d="M4 4.5l.8 8.5a1 1 0 0 0 1 1h4.4a1 1 0 0 0 1-1l.8-8.5"></path></svg>
Leeren
</button>
<button class="tool-btn" style="height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #2a2a2a; color: #d9d9d9; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"></path></svg>
Logs-Ordner öffnen
</button>
</div>

<!-- Filter row -->
<div style="display: flex; align-items: center; gap: 12px">
<label class="search-box" style="width: 320px; height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; background: #2a2a2a; display: flex; align-items: center; gap: 8px; color: #8a8a8a; box-shadow: inset 0 0 0 1px transparent">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
<input type="search" aria-label="Logs durchsuchen" placeholder="Logs durchsuchen…" value="{{query}}" onChange="{{onQuery}}" style="flex-grow: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none; background: transparent; color: #e6e6e6; font-family: inherit; font-size: 13px">
</label>

<div role="group" aria-label="Filter" style="padding: 3px; border-radius: 10px; background: #2a2a2a; display: flex; gap: 2px">
<button class="seg-btn" aria-pressed="{{f.all.pressed}}" onClick="{{f.all.pick}}" style="{{f.all.style}}">Alle <span style="{{f.all.countStyle}}">{{counts.all}}</span></button>
<button class="seg-btn" aria-pressed="{{f.warn.pressed}}" onClick="{{f.warn.pick}}" style="{{f.warn.style}}"><span style="width: 7px; height: 7px; border-radius: 4px; background: #e3b341"></span>Warnungen <span style="{{f.warn.countStyle}}">{{counts.warn}}</span></button>
<button class="seg-btn" aria-pressed="{{f.error.pressed}}" onClick="{{f.error.pick}}" style="{{f.error.style}}"><span style="width: 7px; height: 7px; border-radius: 4px; background: #f47067"></span>Fehler <span style="{{f.error.countStyle}}">{{counts.error}}</span></button>
</div>

<div style="flex-grow: 1"></div>

<button role="switch" aria-checked="{{followChecked}}" onClick="{{toggleFollow}}" style="height: 36px; padding: 0 12px 0 14px; border: 0; border-radius: 8px; background: #2a2a2a; color: #d9d9d9; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 10px; cursor: pointer">
Mitlaufen
<span style="{{trackStyle}}"><span style="{{knobStyle}}"></span></span>
</button>
</div>

<!-- Log output -->
<div style="flex-grow: 1; min-height: 0; border-radius: 12px; background: #191919; box-shadow: inset 0 0 0 1px #2a2a2a; display: flex; flex-direction: column; overflow: hidden">
<div class="log-scroll" ref="{{logRef}}" role="log" aria-live="polite" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 10px 0; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-size: 12.5px; line-height: 1.65">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="20">
<div class="log-row" style="{{l.rowStyle}}">
<span style="color: #5f5f5f; flex-shrink: 0">{{l.time}}</span>
<span style="{{l.levelStyle}}">{{l.level}}</span>
<span style="color: #7a7a7a; flex-shrink: 0; width: 132px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.thread}}</span>
<span style="{{l.msgStyle}}">{{l.msg}}</span>
</div>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 40px 0; text-align: center; font-family: 'Inter', system-ui, sans-serif; font-size: 13px; color: #6b6b6b">{{emptyText}}</p>
</sc-if>
</div>
<div style="height: 32px; flex-shrink: 0; padding: 0 14px; border-top: 1px solid #262626; display: flex; align-items: center; gap: 16px; font-size: 12px; color: #6b6b6b">
<span>{{shownLabel}}</span>
<span>logs/latest.log</span>
<div style="flex-grow: 1"></div>
<span>{{followLabel}}</span>
</div>
</div>

</main>
</div>
</x-dc>

all: all.length,

};
var q = query.toLowerCase();

}).map(function (l) {

time: l[0], level: lvl, thread: l[2], msg: l[3],
rowStyle: 'display: flex; gap: 14px; padding: 0 16px; ' + (lvl === 'ERROR' ? 'background: rgba(244, 112, 103, 0.07); box-shadow: inset 2px 0 0 #f47067' : lvl === 'WARN' ? 'background: rgba(227, 179, 65, 0.05)' : ''),

};
});

var segBase = 'height: 30px; padding: 0 12px; border: 0; border-radius: 8px; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; ';

var segOff = segBase + 'color: #8a8a8a; background: transparent';
var f = {};
['all', 'warn', 'error'].forEach(function (id) {
var on = id === filter;
f[id] = {
pressed: on ? 'true' : 'false',
style: on ? segOn : segOff,
countStyle: 'min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; font-size: 11px; line-height: 18px; text-align: center; background: ' + (on ? 'rgba(255,255,255,0.08)' : '#333333') + '; color: ' + (on ? '#ecc6f2' : '#a3a3a3'),

};
});

src: {

statusLabel: src.running ? 'Läuft' : 'Gestoppt',
