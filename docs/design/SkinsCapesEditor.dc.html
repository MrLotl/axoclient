<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>AxoClient – Cape pixeln</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#4a4a4a;background-clip:padding-box;border:2px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
a{color:#9a9a9a}a:hover{color:#d9d9d9}
.head{image-rendering:pixelated}
.icon-btn{transition:background-color .12s ease}
.icon-btn:hover{background-color:#3a3a3a!important}
.win-btn:hover{background-color:#2c2c2c!important}
.win-close:hover{background-color:#c42b1c!important}
.nav-btn{transition:background-color .12s ease, color .12s ease}
.nav-btn:not([aria-current="page"]):hover{background-color:#2a2a2a!important;color:#d9d9d9!important}
.tool-btn{transition:background-color .12s ease}
.tool-btn:hover{background-color:#353535!important}
.new-btn{transition:filter .12s ease}
.new-btn:hover{filter:brightness(1.12)}
.tool-btn,.new-btn{white-space:nowrap;flex-shrink:0}
.seg-btn:not([aria-pressed="true"]):hover{color:#d9d9d9!important}
.pick-card{transition:background-color .12s ease, box-shadow .12s ease}
.pick-card:not([aria-pressed="true"]):not([data-active="true"]):hover{background-color:#2f2f2f!important}
.upload-card{transition:box-shadow .12s ease, background-color .12s ease}
.upload-card:hover{background-color:rgba(255,255,255,0.03)!important;box-shadow:inset 0 0 0 1.5px rgba(214,140,230,0.5)!important}
.act-btn{transition:background-color .12s ease, color .12s ease}
.act-btn:hover{background-color:#404040!important;color:#e6e6e6!important}
.act-trash:hover{background-color:#4a2a2a!important;color:#ff8a80!important}
.ghost-btn{transition:background-color .12s ease}
.ghost-btn:hover{background-color:#3a3a3a!important}
.second-btn{transition:background-color .12s ease}
.second-btn:not(:disabled):hover{background-color:#444444!important}
.second-btn:disabled{opacity:.45;cursor:default!important}
.grad-btn{transition:filter .12s ease, opacity .12s ease}
.grad-btn:not(:disabled):hover{filter:brightness(1.12)}
.grad-btn:disabled{opacity:.45;cursor:default!important;box-shadow:none!important}
.field{transition:box-shadow .12s ease}
.field:focus-within{box-shadow:inset 0 0 0 1px rgba(214,140,230,0.6)!important}
.field input::placeholder{color:#6b6b6b}
.sr{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.pick-row{position:relative;transition:background-color .12s ease}
.pick-row:hover{background-color:#323232!important}
.pick-row .sr:focus-visible + span{outline:2px solid rgba(214,140,230,0.7);outline-offset:2px}
.cat-chip{transition:background-color .12s ease, color .12s ease}
.cat-chip:not([aria-pressed="true"]):hover{background-color:#353535!important;color:#e6e6e6!important}
.inst-btn{transition:filter .12s ease, background-color .12s ease}
.inst-btn:not(:disabled):hover{filter:brightness(1.15)}
.mini-x{transition:background-color .12s ease, color .12s ease}
.mini-x:hover{background-color:#4a2a2a!important;color:#ff8a80!important}
.cat-row{transition:background-color .12s ease}
.cat-row:hover{background-color:#2f2f2f!important}
@keyframes axo-spin{to{transform:rotate(360deg)}}
.seg-btn:not([aria-pressed="true"]):hover{color:#d9d9d9!important}
.tool{transition:background-color .12s ease, color .12s ease}
.tool:not([aria-pressed="true"]):hover{background-color:#353535!important;color:#e6e6e6!important}
.swatch{transition:transform .1s ease}
.swatch:hover{transform:scale(1.12)}
.drop{transition:box-shadow .12s ease, background-color .12s ease}
.drop:hover{background-color:rgba(255,255,255,0.03)!important;box-shadow:inset 0 0 0 1.5px rgba(214,140,230,0.5)!important}
.canvas{cursor:crosshair;user-select:none;-webkit-user-select:none}
.canvas span:hover{outline:1px solid rgba(255,255,255,0.7);outline-offset:-1px}
.mini-grid,.mini-grid span{pointer-events:none}
/* Tastatur-Fokus */
button:focus{outline:none}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:2px!important;box-shadow:0 0 0 5px rgba(224,122,216,0.18)}
input[type="range"]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:4px!important}
.sr:focus-visible + span{outline:2px solid #e07ad8!important;outline-offset:2px!important}
label:has(> input[type="file"]:focus-visible){outline:2px solid #e07ad8!important;outline-offset:2px!important}
.field:focus-within,.search-box:focus-within{box-shadow:inset 0 0 0 1.5px rgba(224,122,216,0.75)!important}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #1f1f1f">
<dc-import name="SkinsCapes" scene="editor" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
