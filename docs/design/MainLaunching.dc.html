<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>AxoClient – Spiel wird gestartet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#4a4a4a;background-clip:padding-box;border:2px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
a{color:#9a9a9a}a:hover{color:#d9d9d9}
.head{image-rendering:pixelated}
.icon-btn{transition:background-color .12s ease}
.icon-btn:hover{background-color:#3a3a3a!important}
.win-btn:hover{background-color:#2c2c2c!important}
.win-close:hover{background-color:#c42b1c!important}
.join:hover{background-color:#2f4d37!important}
.join-server{transition:background-color .12s ease}
.join-server:hover{background-color:#2f4d37!important}
.play-btn{transition:filter .12s ease, transform .12s ease}
.play-btn:hover{filter:brightness(1.12)}
.play-btn:active{transform:scale(0.98)}
@keyframes axo-shine{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.menu-item{transition:background-color .12s ease}
.menu-item:hover{background-color:#383838!important}
.menu-danger:hover{background-color:rgba(244,112,103,0.12)!important}
.nav-btn{transition:background-color .12s ease, color .12s ease}
.nav-btn:not([aria-current="page"]):hover{background-color:#2a2a2a!important;color:#d9d9d9!important}
.trash:hover{background-color:#4a2a2a!important;color:#ff8a80!important}
.field{transition:box-shadow .12s ease}
.field:focus-within{box-shadow:inset 0 0 0 1px rgba(214,140,230,0.6)!important}
.field input::placeholder{color:#6b6b6b}
.ghost-btn{transition:background-color .12s ease}
.ghost-btn:hover{background-color:#3a3a3a!important}
.grad-btn{transition:filter .12s ease, opacity .12s ease}
.grad-btn:not(:disabled):hover{filter:brightness(1.12)}
.grad-btn:disabled{opacity:.45;cursor:default!important;box-shadow:none!important}
.link-btn:hover{color:#f5d0fb!important}
.update-pill{transition:filter .12s ease}
.update-pill:hover{filter:brightness(1.25)}
.chk{position:relative;display:flex;align-items:center;gap:10px;font-size:13px;color:#d9d9d9;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.chk:hover .sr:not(:checked) + span{box-shadow:inset 0 0 0 1.5px #6a6a6a!important}
.chk .sr:focus-visible + span{outline:2px solid rgba(214,140,230,0.7);outline-offset:2px}
.friend-open{transition:opacity .12s ease}
.friend-open:hover .fname{color:#f5d0fb!important}
.friend-open:focus-visible{outline:2px solid rgba(214,140,230,0.7);outline-offset:3px;border-radius:6px}
.second-btn{transition:background-color .12s ease}
.second-btn:hover{background-color:#444444!important}
.danger-btn{transition:background-color .12s ease}
.danger-btn:hover{background-color:rgba(244,112,103,0.14)!important}
.toast-x:hover{background-color:#3a3a3a!important;color:#e6e6e6!important}
.dl-btn{transition:filter .12s ease}
.dl-btn:hover{filter:brightness(1.12)}
.open-btn:hover{background-color:#2f4d37!important}
@keyframes axo-spin{to{transform:rotate(360deg)}}
@keyframes toast-in{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes toast-bar{from{width:100%}to{width:0%}}
/* Tastatur-Fokus */
button:focus{outline:none}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:2px!important;box-shadow:0 0 0 5px rgba(224,122,216,0.18)}
input[type="range"]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:4px!important}
.sr:focus-visible + span{outline:2px solid #e07ad8!important;outline-offset:2px!important}
label:has(> input[type="file"]:focus-visible){outline:2px solid #e07ad8!important;outline-offset:2px!important}
.field:focus-within,.search-box:focus-within{box-shadow:inset 0 0 0 1.5px rgba(224,122,216,0.75)!important}
</style>
</helmet>
<div style="width: 1280px; height: 800px; background: #1f1f1f">
<dc-import name="Main" scene="launching" hint-size="1280px,800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
