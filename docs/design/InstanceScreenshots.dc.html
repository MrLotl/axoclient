<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{scrollbar-width:thin;scrollbar-color:#3a3a3a transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background:#4a4a4a;background-clip:padding-box;border:2px solid transparent}
*::-webkit-scrollbar-corner{background:transparent}
a{color:#9a9a9a}a:hover{color:#d9d9d9}
.head{image-rendering:pixelated}
.icon-btn{transition:background-color .12s ease}
.icon-btn:hover{background-color:#3a3a3a!important}
.win-btn:hover{background-color:#2c2c2c!important}
.win-close:hover{background-color:#c42b1c!important}
.nav-btn{transition:background-color .12s ease, color .12s ease}
.nav-btn:not([aria-current="page"]):hover{background-color:#2a2a2a!important;color:#d9d9d9!important}
.tool-btn{transition:background-color .12s ease}
.tool-btn:hover{background-color:#353535!important}
.new-btn{transition:filter .12s ease}
.new-btn:hover{filter:brightness(1.12)}
.tool-btn,.new-btn{white-space:nowrap;flex-shrink:0}
.seg-btn:not([aria-pressed="true"]):hover{color:#d9d9d9!important}
.hero-btn{transition:background-color .12s ease}
.hero-btn:hover{background-color:rgba(255,255,255,0.16)!important}
.play-btn{transition:background-color .12s ease, transform .12s ease}
.play-btn:hover{background-color:#2f4d37!important}
.play-btn:active{transform:scale(0.98)}
.back-btn{transition:background-color .12s ease}
.back-btn:hover{background-color:rgba(0,0,0,0.55)!important}
.month-nav:hover{background-color:#353535!important}

.tab-btn{transition:color .12s ease}
.tab-btn:not([aria-current="page"]):hover{color:#d9d9d9!important}
.search-box:focus-within{box-shadow:inset 0 0 0 1px rgba(214,140,230,0.45)!important}
.search-box input::placeholder{color:#6b6b6b}
.search-box input::-webkit-search-cancel-button{display:none}
.act-btn{transition:background-color .12s ease, color .12s ease}
.act-btn:hover{background-color:#404040!important;color:#e6e6e6!important}
.activate-btn{transition:background-color .12s ease}
.activate-btn:not([aria-pressed="true"]):hover{background-color:#404040!important;color:#f2f2f2!important}
.start-btn{transition:background-color .12s ease}
.start-btn:hover{background-color:#2f4d37!important}
.act-trash:hover{background-color:#4a2a2a!important;color:#ff8a80!important}
.shot-btn img{transition:transform .25s ease, filter .25s ease}
.shot-btn:hover img{transform:scale(1.04);filter:brightness(1.08)}
.shot-btn:focus-visible{outline:2px solid rgba(214,140,230,0.7);outline-offset:2px}
/* Tastatur-Fokus */
button:focus{outline:none}
button:focus-visible,a:focus-visible,select:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:2px!important;box-shadow:0 0 0 5px rgba(224,122,216,0.18)}
input[type="range"]:focus-visible{outline:2px solid #e07ad8!important;outline-offset:4px!important}
.sr:focus-visible + span{outline:2px solid #e07ad8!important;outline-offset:2px!important}
label:has(> input[type="file"]:focus-visible){outline:2px solid #e07ad8!important;outline-offset:2px!important}
.field:focus-within,.search-box:focus-within{box-shadow:inset 0 0 0 1.5px rgba(224,122,216,0.75)!important}
</style>
</helmet>

</button>
</div>
</div>

</a>

</a>
</nav>

<!-- Content area -->

<!-- Hero -->

Zurück

<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600">
<span style="height: 24px; padding: 0 9px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(6px); color: #f2f2f2; line-height: 24px">1.21.4 · Fabric</span>
<span style="height: 24px; padding: 0 9px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(6px); color: #f2f2f2; line-height: 24px">12 Mods</span>
</div>
</div>
<a class="hero-btn" href="InstanceShare.dc.html" aria-label="Instanz an Freunde senden" title="Instanz senden" style="width: 44px; height: 44px; border-radius: 10px; background: rgba(255, 255, 255, 0.09); backdrop-filter: blur(8px); color: #f2f2f2; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="3.5" r="1.8"></circle><circle cx="4" cy="8" r="1.8"></circle><circle cx="12" cy="12.5" r="1.8"></circle><path d="M5.6 7.1l4.8-2.7M5.6 8.9l4.8 2.7"></path></svg>
</a>

<svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"></path></svg>
</button>

<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M5 3.5v9l7-4.5z"></path></svg>

<!-- Tabs -->
<nav aria-label="Instanz-Bereiche" style="flex-shrink: 0; height: 38px; display: flex; align-items: stretch; gap: 4px; border-bottom: 1px solid #2f2f2f">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="8">
<sc-if value="{{t.isLink}}" hint-placeholder-val="{{false}}">
<a class="tab-btn" href="{{t.href}}" aria-current="{{t.current}}" style="{{t.style}}">
{{t.label}}
<sc-if value="{{t.hasCount}}" hint-placeholder-val="{{false}}">
<span style="{{t.countStyle}}">{{t.count}}</span>
</sc-if>
<span aria-hidden="true" style="{{t.barStyle}}"></span>
</a>
</sc-if>
<sc-if value="{{t.isButton}}" hint-placeholder-val="{{true}}">
<button class="tab-btn" aria-current="{{t.current}}" onClick="{{t.pick}}" style="{{t.style}}">
{{t.label}}
<sc-if value="{{t.hasCount}}" hint-placeholder-val="{{false}}">
<span style="{{t.countStyle}}">{{t.count}}</span>
</sc-if>
<span aria-hidden="true" style="{{t.barStyle}}"></span>
</button>
</sc-if>
</sc-for>
</nav>





<!-- Toolbar -->
<div style="flex-shrink: 0; display: flex; align-items: center; gap: 10px">
<label class="search-box" style="width: 260px; height: 36px; box-sizing: border-box; padding: 0 12px; border-radius: 8px; background: #2a2a2a; display: flex; align-items: center; gap: 8px; color: #8a8a8a; box-shadow: inset 0 0 0 1px transparent">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5L14 14"></path></svg>
<input type="search" aria-label="Screenshots durchsuchen" placeholder="Screenshots durchsuchen…" value="{{query}}" onChange="{{onQuery}}" style="flex-grow: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: none; background: transparent; color: #e6e6e6; font-family: inherit; font-size: 13px">
</label>
<span style="min-width: 0; font-size: 13px; color: #8a8a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{summary}}</span>
<div style="flex-grow: 1"></div>
<button class="tool-btn" style="height: 36px; padding: 0 14px; border: 0; border-radius: 8px; background: #2a2a2a; color: #d9d9d9; font-family: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h2.6l1.4 1.5h5A1.5 1.5 0 0 1 14 6v5.5a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 2 11.5z"></path></svg>
Screenshot-Ordner öffnen
</button>
</div>

<!-- Gallery -->
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; margin-right: -8px; padding-right: 8px; display: flex; flex-direction: column; gap: 22px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 13px; font-weight: 600; color: #a3a3a3">{{g.title}} <span style="font-weight: 500; color: #6b6b6b">· {{g.count}}</span></h3>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{g.items}}" as="s" hint-placeholder-count="4">
<article class="mod-card" style="padding: 8px; border-radius: 12px; background: #2a2a2a; display: flex; flex-direction: column; gap: 8px">
<button class="shot-btn" aria-label="{{s.openLabel}}" onClick="{{s.open}}" style="position: relative; aspect-ratio: 16 / 9; padding: 0; border: 0; border-radius: 8px; overflow: hidden; background: #1c1c1c; cursor: zoom-in; display: block">
<img src="{{s.image}}" alt="" style="{{s.imgStyle}}">
</button>
<div style="display: flex; align-items: center; gap: 6px; padding: 0 2px">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<sc-if value="{{s.editing}}" hint-placeholder-val="{{false}}">
<input aria-label="Neuer Dateiname" value="{{s.draft}}" onChange="{{s.onDraft}}" onKeyDown="{{s.onKey}}" onBlur="{{s.commit}}" ref="{{s.inputRef}}" style="width: 100%; box-sizing: border-box; height: 22px; padding: 0 6px; border: 0; border-radius: 5px; outline: none; background: #1c1c1c; box-shadow: inset 0 0 0 1px rgba(214, 140, 230, 0.55); color: #f2f2f2; font-family: inherit; font-size: 12.5px">
</sc-if>
<sc-if value="{{s.notEditing}}" hint-placeholder-val="{{true}}">
<span title="{{s.name}}" style="font-size: 12.5px; font-weight: 500; color: #e6e6e6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.name}}</span>
</sc-if>
<span style="font-size: 11px; color: #7a7a7a">{{s.meta}}</span>
</div>
<button class="act-btn" aria-label="{{s.renameLabel}}" onClick="{{s.rename}}" style="width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: #353535; color: #a3a3a3; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5l3 3L5.5 13.5H2.5v-3z"></path><path d="M9 4l3 3"></path></svg>
</button>
<button class="act-btn" aria-label="{{s.copyLabel}}" onClick="{{s.copy}}" style="{{s.copyStyle}}">
<sc-if value="{{s.copied}}" hint-placeholder-val="{{false}}">
<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"></path></svg>
</sc-if>

</article>
</sc-for>
</div>

</button>

</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {

}
renderVals() {

var removed = this.state.removed || [];
var names = this.state.names || {};
var editing = this.state.editing || null;
var copied = this.state.copied || null;

var data = [
{ id: 's1', file: '2026-10-01_19.43.20.png', group: 'Heute', time: '19:43', size: 3.1, image: '/_blob/432ce3810aa839a7b6c557634e958c30' },

];

var order = [];

present.forEach(function (s) {

if (query && name.toLowerCase().indexOf(query) === -1) return;
if (!byGroup[s.group]) { byGroup[s.group] = []; order.push(s.group); }
var isEditing = editing === s.id;
var isCopied = copied === s.id;
var commit = function () {

self.setState({ names: n, editing: null });
};
byGroup[s.group].push({

meta: s.time + ' · ' + fmtMb(s.size),
imgStyle: 'width: 100%; height: 100%; object-fit: cover; display: block' + (s.pixel ? '; image-rendering: pixelated' : ''),

inputRef: function (el) { if (el && isEditing && self.wantFocus) { self.focusInput = el; self.wantFocus = false; } },
onDraft: function (e) { self.setState({ draft: e.target.value }); },
onKey: function (e) { if (e.key === 'Enter') commit(); if (e.key === 'Escape') self.setState({ editing: null }); },
commit: commit,
rename: function () { self.wantFocus = true; self.setState({ editing: s.id, draft: name.replace(/\.png$/i, '') }); },
copy: function () {
self.setState({ copied: s.id });
clearTimeout(self.copyTimer);
self.copyTimer = setTimeout(function () { self.setState({ copied: null }); }, 1400);
},
open: function () { self.setState({ preview: s.id }); },
remove: function () { self.setState({ removed: removed.concat([s.id]), preview: null }); }
});
});
var groups = order.map(function (g) { return { title: g, count: byGroup[g].length, items: byGroup[g] }; });
var shown = groups.reduce(function (a, g) { return a + g.count; }, 0);

var pv = present.filter(function (s) { return s.id === self.state.preview; })[0];

var tabDefs = [
['overview', 'Übersicht', null], ['mods', 'Mods', 12], ['packs', 'Ressourcepacks', 8], ['shaders', 'Shader', 8],

];

var tabs = tabDefs.map(function (t) {

return {
label: t[1], count: t[2], hasCount: t[2] !== null,
href: links[t[0]] || '', isLink: !!links[t[0]], isButton: !links[t[0]],
current: on ? 'page' : 'false',
style: 'position: relative; height: 38px; padding: 0 12px; border: 0; background: transparent; cursor: pointer; text-decoration: none; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; color: ' + (on ? '#f2f2f2' : '#8a8a8a'),
countStyle: 'min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; font-size: 11px; line-height: 18px; text-align: center; background: ' + (on ? 'rgba(236, 72, 153, 0.18)' : '#2c2c2c') + '; color: ' + (on ? '#ecc6f2' : '#8a8a8a'),
barStyle: 'position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: ' + (on ? 'linear-gradient(90deg, #ec4899, #8b5cf6)' : 'transparent'),
pick: function () {}
};
});

return {
tabs: tabs, groups: groups, query: this.state.query || '',
empty: shown === 0,
summary: present.length + ' Screenshots · ' + fmtMb(totalMb),
hasPreview: !!pv,
preview: pv ? {

} : { image: '', name: '', meta: '', imgStyle: '' },
closePreview: function () { self.setState({ preview: null }); },
onQuery: function (e) { self.setState({ query: e.target.value }); }
};
}
}
